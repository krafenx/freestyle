# Внешний «будильник» для напоминаний. Пошаговая инструкция: docs/cron.md
#
# На Telegram Serverless нет таймера, поэтому T-3/T-1/T-0 приходят только когда
# бота кто-то тронул (ленивый тик). Этот workflow будит его по расписанию.
#
# Что нужно один раз сделать:
#   1. В @BotFather → ваш бот → Serverless → CLI Access скопировать access token
#      (это НЕ обычный токен бота, он выглядит как app12345:xxxxx).
#   2. В настройках репозитория добавить секрет TGCLOUD_TOKEN с этим значением.
#   3. Файл должен оказаться в ветке по умолчанию (main) — расписание
#      из других ветвей GitHub не запускает.
#
# Если секрета нет — workflow просто напишет notice и ничего не сделает.

name: vip-reminders

on:
  schedule:
    - cron: '0 * * * *'   # каждый час; GitHub может задержать запуск на 5–20 мин
  workflow_dispatch: {}

concurrency:
  group: vip-reminders
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: gate
        run: echo "have=${{ secrets.TGCLOUD_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.have != 'true'
        run: echo "::notice::TGCLOUD_TOKEN не задан — тик пропущен (см. шапку workflow)"

      - if: steps.gate.outputs.have == 'true'
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          npm install --no-audit --no-fund --no-save @tgcloud/cli@^0.2.0
          npx tgcloud run endpoints/tick
